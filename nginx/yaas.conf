# ══════════════════════════════════════════════════════════════════════════════
# YAAS Studio — Nginx Reverse Proxy Configuration
# Place this file in: /etc/nginx/sites-available/yaas.conf
# Enable via symlink: sudo ln -s /etc/nginx/sites-available/yaas.conf /etc/nginx/sites-enabled/
# ══════════════════════════════════════════════════════════════════════════════

# WebSocket Connection Header Mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP (Port 80) — Redirect to HTTPS & ACME Challenge ───────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SUBDOMAIN;

    # Allow Let's Encrypt / Certbot challenges without Basic Auth
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (Port 443) — Reverse Proxy to YAAS Studio ───────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_SUBDOMAIN;

    # ── SSL Certificate Placeholders (Certbot will manage these) ──────────────
    ssl_certificate /etc/letsencrypt/live/YOUR_SUBDOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_SUBDOMAIN/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── HTTP Basic Authentication ──────────────────────────────────────────────
    auth_basic "Restricted Access — YAAS Studio";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Allow Let's Encrypt / Certbot challenges on HTTPS as well
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # ── Upload & Request Size Limits (for video/thumbnail uploads) ─────────────
    client_max_body_size 500M;

    # ── Reverse Proxy Location ────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:7070;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Server-Sent Events (SSE) & Log Streaming (Disables Buffering)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

